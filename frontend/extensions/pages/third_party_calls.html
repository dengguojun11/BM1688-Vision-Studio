<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第三方调用中心</title>
  <link rel="stylesheet" href="/assets/labelu_standalone_shell.css" />
  <link rel="stylesheet" href="/assets/labelu_toolkit_compact.css" />
  <script defer src="/assets/labelu_auth_bridge.js"></script>
  <script defer src="/assets/labelu_portal.js"></script>
  <style>
    :root {
      --bg:#f3f6f7; --panel:#fff; --line:#d9e1e5; --line-soft:#e9eef0;
      --text:#17212b; --muted:#63717d; --brand:#096c5b; --brand-soft:#e9f5f1;
      --blue:#1769aa; --blue-soft:#edf5fb; --amber:#9b6500; --amber-soft:#fff6df;
      --red:#b42335; --red-soft:#fff0f2; --green:#137a43; --green-soft:#eaf7ef;
      --shadow:0 18px 48px rgba(24,39,52,.16);
    }
    * { box-sizing:border-box; }
    body.labelu-shell { margin:0; min-height:100vh; background:var(--bg); color:var(--text); }
    button, input, select { font:inherit; }
    .page-main { max-width:1540px; margin:0 auto; padding:18px 20px 36px; }
    .page-head { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:14px; }
    .page-head h1 { margin:0 0 4px; font-size:24px; line-height:1.2; letter-spacing:0; }
    .head-meta { color:var(--muted); font-size:12px; }
    .head-actions { display:flex; align-items:center; gap:8px; }
    .readonly { display:inline-flex; align-items:center; height:32px; padding:0 10px; border:1px solid #b8d3cc; border-radius:6px; background:var(--brand-soft); color:var(--brand); font-size:12px; font-weight:650; }
    .btn { min-height:34px; padding:7px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--text); cursor:pointer; }
    .btn:hover { border-color:#94ada7; background:#fbfdfc; }
    .btn.primary { border-color:var(--brand); background:var(--brand); color:#fff; }
    .btn.compact { min-height:30px; padding:5px 9px; font-size:12px; }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .metrics { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin-bottom:12px; }
    .metric { min-height:86px; padding:13px 14px; border:1px solid var(--line); border-radius:7px; background:var(--panel); position:relative; overflow:hidden; }
    .metric::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:#a8b4bb; }
    .metric.info::before { background:var(--blue); } .metric.wait::before { background:#d59a1d; }
    .metric.danger::before { background:var(--red); } .metric.ok::before { background:var(--green); }
    .metric-label { color:var(--muted); font-size:11px; font-weight:650; }
    .metric-value { margin-top:5px; font-size:25px; line-height:1; font-weight:750; font-variant-numeric:tabular-nums; }
    .metric-note { margin-top:6px; color:var(--muted); font-size:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .console { border:1px solid var(--line); border-radius:8px; background:var(--panel); overflow:hidden; }
    .console-top { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 14px; border-bottom:1px solid var(--line); }
    .segmented { display:inline-flex; padding:3px; border:1px solid var(--line); border-radius:7px; background:#f4f7f8; }
    .segment { min-width:112px; height:31px; padding:0 13px; border:0; border-radius:5px; background:transparent; color:var(--muted); cursor:pointer; font-size:12px; font-weight:650; }
    .segment.active { background:#fff; color:var(--text); box-shadow:0 1px 3px rgba(22,35,46,.12); }
    .view-total { color:var(--muted); font-size:12px; white-space:nowrap; }
    .filters { display:grid; grid-template-columns:minmax(220px,1.4fr) repeat(3,minmax(150px,.7fr)) auto; gap:9px; align-items:end; padding:11px 14px; border-bottom:1px solid var(--line-soft); background:#fbfcfc; }
    .filter-field label { display:block; margin-bottom:5px; color:var(--muted); font-size:10px; font-weight:700; }
    .filter-field input, .filter-field select { width:100%; height:34px; border:1px solid var(--line); border-radius:6px; padding:0 9px; background:#fff; color:var(--text); font-size:12px; outline:none; }
    .filter-field input:focus, .filter-field select:focus { border-color:var(--brand); box-shadow:0 0 0 2px rgba(9,108,91,.1); }
    .filter-actions { display:flex; gap:7px; }
    .table-wrap { width:100%; overflow:auto; min-height:360px; }
    table { width:100%; min-width:1120px; border-collapse:collapse; table-layout:fixed; }
    th, td { padding:10px 12px; border-bottom:1px solid var(--line-soft); text-align:left; vertical-align:middle; font-size:12px; }
    th { position:sticky; top:0; z-index:1; background:#f7f9fa; color:#53616c; font-size:10px; font-weight:750; }
    tbody tr { cursor:pointer; }
    tbody tr:hover { background:#f5faf8; }
    .primary-text { display:block; color:var(--text); font-weight:680; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .subline { display:block; margin-top:3px; color:var(--muted); font-size:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .mono { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
    .status { display:inline-flex; align-items:center; min-height:23px; padding:3px 8px; border:1px solid #c5d0d5; border-radius:999px; background:#f5f7f8; color:#54626d; font-size:10px; font-weight:700; white-space:nowrap; }
    .status.processing { border-color:#a8cce8; background:var(--blue-soft); color:var(--blue); }
    .status.waiting { border-color:#e7ca83; background:var(--amber-soft); color:var(--amber); }
    .status.blocked, .status.failed, .status.rejected { border-color:#efb9c1; background:var(--red-soft); color:var(--red); }
    .status.completed, .status.succeeded, .status.accepted { border-color:#a9d8bb; background:var(--green-soft); color:var(--green); }
    .next-action { line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .owner { color:var(--brand); font-size:10px; font-weight:750; }
    .empty, .loading, .error-state { height:360px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }
    .error-state { color:var(--red); }
    .pager { display:flex; align-items:center; justify-content:flex-end; gap:9px; min-height:48px; padding:8px 14px; border-top:1px solid var(--line); }
    .pager-label { color:var(--muted); font-size:11px; }
    .auth-box { margin:0 20px 12px; padding:11px 13px; border:1px solid #e7ca83; border-radius:7px; background:var(--amber-soft); color:#694800; font-size:12px; }
    .modal-backdrop { position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(21,31,39,.28); }
    .modal-backdrop.show { display:flex; }
    .modal { width:min(760px,96vw); max-height:92vh; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); display:flex; flex-direction:column; }
    .modal-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:18px 20px 14px; border-bottom:1px solid var(--line); }
    .modal-kicker { color:var(--muted); font-size:10px; font-weight:750; }
    .modal-title { margin:4px 0 6px; font-size:18px; line-height:1.35; word-break:break-word; }
    .modal-close { width:34px; height:34px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--muted); cursor:pointer; font-size:22px; line-height:1; }
    .modal-body { flex:1; overflow:auto; padding:16px 20px 28px; }
    .action-callout { margin-bottom:15px; padding:12px 14px; border:1px solid #b8d3cc; border-left:4px solid var(--brand); border-radius:6px; background:#f2f9f6; }
    .action-callout label { display:block; color:var(--brand); font-size:10px; font-weight:750; }
    .action-callout strong { display:block; margin-top:5px; font-size:13px; line-height:1.5; }
    .detail-section { padding:15px 0; border-top:1px solid var(--line-soft); }
    .detail-section:first-child { border-top:0; padding-top:0; }
    .detail-section h3 { margin:0 0 10px; font-size:13px; }
    .detail-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 18px; }
    .detail-item { min-width:0; }
    .detail-item label { display:block; color:var(--muted); font-size:10px; }
    .detail-item span { display:block; margin-top:3px; font-size:12px; overflow-wrap:anywhere; }
    .timeline { position:relative; margin-left:5px; padding-left:20px; }
    .timeline::before { content:""; position:absolute; left:4px; top:7px; bottom:7px; width:1px; background:#cbd5da; }
    .timeline-item { position:relative; padding:0 0 15px; }
    .timeline-item:last-child { padding-bottom:0; }
    .timeline-item::before { content:""; position:absolute; left:-20px; top:4px; width:9px; height:9px; border:2px solid #fff; border-radius:50%; background:var(--brand); box-shadow:0 0 0 1px #9dc8bd; }
    .timeline-item strong { display:block; font-size:12px; }
    .timeline-item span { display:block; margin-top:3px; color:var(--muted); font-size:10px; line-height:1.45; }
    .resource-list { display:flex; flex-wrap:wrap; gap:6px; }
    .resource { padding:5px 7px; border:1px solid var(--line); border-radius:5px; background:#f8fafb; color:#40505c; font:10px ui-monospace,SFMono-Regular,Consolas,monospace; }
    .event-list { border:1px solid var(--line); border-radius:6px; overflow:hidden; }
    .event-row { display:grid; grid-template-columns:104px 1fr auto; gap:8px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line-soft); font-size:10px; }
    .event-row:last-child { border-bottom:0; }
    pre { margin:0; max-height:300px; overflow:auto; padding:12px; border:1px solid var(--line); border-radius:6px; background:#f6f8f9; color:#35434e; font:10px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
    .toast { position:fixed; left:50%; bottom:22px; z-index:100; display:none; max-width:88vw; transform:translateX(-50%); padding:10px 14px; border-radius:6px; background:#17212b; color:#fff; font-size:12px; }
    @media (max-width:1100px) { .metrics { grid-template-columns:repeat(3,minmax(0,1fr)); } .filters { grid-template-columns:repeat(2,minmax(0,1fr)); } .filter-actions { justify-content:flex-end; } }
    @media (max-width:680px) { .page-main { padding:14px 10px 26px; } .page-head { align-items:flex-start; } .head-actions { align-items:flex-end; flex-direction:column; } .metrics { grid-template-columns:repeat(2,minmax(0,1fr)); } .metric { min-height:78px; } .console-top { align-items:flex-start; flex-direction:column; } .segmented { width:100%; } .segment { flex:1; min-width:0; } .filters { grid-template-columns:1fr; } .filter-actions .btn { flex:1; } .detail-grid { grid-template-columns:1fr; } .modal-backdrop { padding:10px; } .modal-body { padding-left:14px; padding-right:14px; } }
  </style>
</head>
<body class="labelu-shell" data-lu-page="third-party-calls">
  <header class="labelu-shell-header">
    <div class="labelu-shell-brand">7GAI 进化平台 / 第三方调用中心</div>
    <nav class="labelu-shell-nav"></nav>
  </header>
  <div id="luPageHero"></div>
  <div class="auth-box" id="authBox" style="display:none;">当前未登录，请先前往<a data-lu-login-link href="/login">登录</a>。</div>
  <main class="page-main">
    <div class="page-head">
      <div><h1>第三方调用中心</h1><div class="head-meta" id="headMeta">状态更新时间 -</div></div>
      <div class="head-actions"><span class="readonly">管理员只读</span><button class="btn primary" id="btnRefresh" type="button">刷新</button></div>
    </div>
    <section class="metrics" aria-label="第三方调用摘要">
      <div class="metric info"><div class="metric-label">今日调用</div><div class="metric-value" id="metricCalls">-</div><div class="metric-note" id="metricCallFailures">失败 -</div></div>
      <div class="metric"><div class="metric-label">业务链路</div><div class="metric-value" id="metricTotal">-</div><div class="metric-note">全部第三方业务记录</div></div>
      <div class="metric info"><div class="metric-label">系统处理中</div><div class="metric-value" id="metricProcessing">-</div><div class="metric-note">系统自动推进</div></div>
      <div class="metric wait"><div class="metric-label">等待外部处理</div><div class="metric-value" id="metricWaiting">-</div><div class="metric-note">第三方、标注或管理员</div></div>
      <div class="metric danger"><div class="metric-label">阻塞</div><div class="metric-value" id="metricBlocked">-</div><div class="metric-note">需要人工排查</div></div>
      <div class="metric ok"><div class="metric-label">已完成</div><div class="metric-value" id="metricCompleted">-</div><div class="metric-note" id="metricCallbacks">待处理回调 -</div></div>
    </section>
    <section class="console">
      <div class="console-top">
        <div class="segmented" role="tablist" aria-label="调用视图">
          <button class="segment active" type="button" role="tab" aria-selected="true" data-view="chains">业务链路</button>
          <button class="segment" type="button" role="tab" aria-selected="false" data-view="calls">调用明细</button>
        </div>
        <div class="view-total" id="viewTotal">共 - 条</div>
      </div>
      <div class="filters">
        <div class="filter-field"><label for="filterKeyword">关键字</label><input id="filterKeyword" placeholder="任务 ID、数据包 ID、请求 ID" /></div>
        <div class="filter-field"><label for="filterSource">来源系统</label><select id="filterSource"><option value="">全部来源</option></select></div>
        <div class="filter-field" id="chainTypeField"><label for="filterType">业务类型</label><select id="filterType"><option value="">全部业务类型</option><option value="dataset_creation">任务数据集创建</option><option value="model_optimization">模型优化</option><option value="threshold_experiment">阈值实验</option><option value="strategy_task">策略任务</option></select></div>
        <div class="filter-field" id="chainHealthField"><label for="filterHealth">处置状态</label><select id="filterHealth"><option value="">全部状态</option><option value="processing">系统处理中</option><option value="waiting">等待外部处理</option><option value="blocked">阻塞</option><option value="completed">已完成</option></select></div>
        <div class="filter-field" id="callOutcomeField" hidden><label for="filterOutcome">调用结果</label><select id="filterOutcome"><option value="">全部结果</option><option value="succeeded">成功</option><option value="accepted">已受理</option><option value="rejected">已拒绝</option><option value="failed">失败</option></select></div>
        <div class="filter-field" id="callHoursField" hidden><label for="filterHours">时间范围</label><select id="filterHours"><option value="24">最近 24 小时</option><option value="168" selected>最近 7 天</option><option value="720">最近 30 天</option><option value="8760">最近一年</option></select></div>
        <div class="filter-actions"><button class="btn" id="btnReset" type="button">重置</button><button class="btn primary" id="btnQuery" type="button">查询</button></div>
      </div>
      <div class="table-wrap" id="tableRoot"><div class="loading">正在加载...</div></div>
      <div class="pager"><span class="pager-label" id="pagerLabel">第 1 页</span><button class="btn compact" id="btnPrev" type="button">上一页</button><button class="btn compact" id="btnNext" type="button">下一页</button></div>
    </section>
  </main>
  <div class="modal-backdrop" id="detailModalBackdrop"></div>
  <section class="modal" id="detailModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modalTitle">
    <div class="modal-head"><div><div class="modal-kicker" id="modalKicker">业务链路</div><h2 class="modal-title" id="modalTitle">详情</h2><span class="status" id="modalStatus">-</span></div><button class="modal-close" id="btnCloseModal" type="button" title="关闭" aria-label="关闭">×</button></div>
    <div class="modal-body" id="modalBody"><div class="loading">正在加载...</div></div>
  </section>
  <div class="toast" id="toast"></div>
  <script>
  (function () {
    var state = { view:"chains", page:0, size:20, total:0, items:[], summary:null, loading:false };
    function token(){ return window.LabeluPortal && window.LabeluPortal.getAuthToken ? window.LabeluPortal.getAuthToken() : ""; }
    function syncAuth(){ if(window.LabeluPortal && window.LabeluPortal.syncAuthBox) return !!window.LabeluPortal.syncAuthBox(); var box=document.getElementById("authBox"); if(box)box.style.display=token()?"none":""; return !!token(); }
    function esc(v){ return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    function sourceSystemLabel(v){ var raw=String(v||"unknown").trim().toLowerCase(); var m={strategy_evolution:"策略演进平台",experiment_platform:"实验平台",labelu_auto_training:"7GAI 自动训练",labelu:"7GAI 系统",third_party:"第三方系统",unknown:"未识别来源"}; return m[raw]||("第三方系统（"+String(v||"unknown")+"）"); }
    function toast(msg){ var el=document.getElementById("toast"); el.textContent=msg||""; el.style.display="block"; clearTimeout(el._t); el._t=setTimeout(function(){el.style.display="none";},2600); }
    async function api(path){ var headers={}; if(token())headers.Authorization=token(); var res=await fetch("/api/v1"+path,{headers:headers,credentials:"same-origin",cache:"no-store"}); var raw=await res.text(); var body={}; try{body=raw?JSON.parse(raw):{};}catch(e){} if(res.status===401||res.status===403){syncAuth();throw new Error("当前账号没有管理员权限");} if(!res.ok)throw new Error(body.msg||body.detail||body.message||("HTTP "+res.status)); return body.data; }
    function time(v){ if(!v)return "-"; var d=new Date(v); if(isNaN(d.getTime()))return String(v).replace("T"," ").slice(0,19); return d.toLocaleString("zh-CN",{hour12:false}); }
    function statusHtml(label,kind){ return '<span class="status '+esc(kind||"")+'">'+esc(label||"-")+'</span>'; }
    function operationLabel(v){ var m={experiment_dataset_import:"任务数据集创建",threshold_experiment:"阈值实验",model_capability:"模型优化",strategy_evolution_task:"策略任务",strategy_task_import:"策略任务导入",strategy_platform_callback:"平台状态回调",strategy_status_query:"状态查询"}; return m[v]||v||"-"; }
    function businessTypeKey(item){ if(item&&item.business_type)return String(item.business_type).trim().toLowerCase(); var op=String(item&&item.operation||"").trim().toLowerCase(); if(op==="experiment_dataset_import"||item&&item.record_type==="dataset_import")return "dataset_creation"; if(op==="model_capability")return "model_optimization"; if(op==="threshold_experiment")return "threshold_experiment"; return "strategy_task"; }
    function businessTypeLabel(item){ var m={dataset_creation:"任务数据集创建",model_optimization:"模型优化",threshold_experiment:"阈值实验",strategy_task:"策略任务"}; return (item&&item.business_type_label)||m[item&&item.business_type]||operationLabel(item&&item.operation)||"-"; }
    function queryString(params){ var q=new URLSearchParams(); Object.keys(params).forEach(function(k){if(params[k]!==""&&params[k]!=null)q.set(k,params[k]);}); return q.toString(); }
    function renderSummary(){ var s=state.summary||{}; document.getElementById("metricCalls").textContent=s.calls_today==null?"-":s.calls_today; document.getElementById("metricCallFailures").textContent="失败 "+(s.call_failures_today==null?"-":s.call_failures_today); document.getElementById("metricTotal").textContent=s.total_chains==null?"-":s.total_chains; document.getElementById("metricProcessing").textContent=s.processing==null?"-":s.processing; document.getElementById("metricWaiting").textContent=s.waiting==null?"-":s.waiting; document.getElementById("metricBlocked").textContent=s.blocked==null?"-":s.blocked; document.getElementById("metricCompleted").textContent=s.completed==null?"-":s.completed; document.getElementById("metricCallbacks").textContent="待处理回调 "+(s.callback_pending==null?"-":s.callback_pending); document.getElementById("headMeta").textContent="状态更新时间 "+time(s.generated_at); var source=document.getElementById("filterSource"), current=source.value, list=Array.isArray(s.source_systems)?s.source_systems:[]; source.innerHTML='<option value="">全部来源</option>'+list.map(function(x){return '<option value="'+esc(x)+'">'+esc(sourceSystemLabel(x))+'</option>';}).join(""); source.value=current; }
    function filters(){ return { keyword:document.getElementById("filterKeyword").value.trim(), source_system:document.getElementById("filterSource").value, business_type:document.getElementById("filterType").value, health:document.getElementById("filterHealth").value, outcome:document.getElementById("filterOutcome").value, hours:document.getElementById("filterHours").value }; }
    function renderChains(){ if(!state.items.length)return '<div class="empty">当前筛选条件下没有业务链路</div>'; return '<table><colgroup><col style="width:23%"><col style="width:17%"><col style="width:15%"><col style="width:25%"><col style="width:12%"><col style="width:8%"></colgroup><thead><tr><th>来源 / 业务标识</th><th>业务类型</th><th>当前阶段</th><th>下一步</th><th>更新时间</th><th>详情</th></tr></thead><tbody>'+state.items.map(function(x,i){return '<tr data-index="'+i+'"><td><span class="primary-text">'+esc(x.title||x.record_id)+'</span><span class="subline">'+esc(sourceSystemLabel(x.source_system))+' · <span class="mono">'+esc(x.record_id)+'</span></span></td><td><span class="primary-text">'+esc(businessTypeLabel(x))+'</span><span class="subline">'+esc(x.operation_label||x.operation||"-")+'</span></td><td>'+statusHtml(x.status_label,x.health)+'<span class="subline">'+esc(x.current_stage||"-")+'</span></td><td><span class="owner">'+esc(x.next_action_owner||"-")+'</span><span class="next-action">'+esc(x.next_action||"-")+'</span></td><td><span class="primary-text">'+esc(time(x.updated_at||x.created_at))+'</span><span class="subline">'+esc(x.status_detail||"")+'</span></td><td><button class="btn compact" type="button">查看</button></td></tr>';}).join("")+'</tbody></table>'; }
    function renderCalls(){ if(!state.items.length)return '<div class="empty">当前时间范围内没有调用记录</div>'; return '<table><colgroup><col style="width:18%"><col style="width:22%"><col style="width:12%"><col style="width:10%"><col style="width:26%"><col style="width:12%"></colgroup><thead><tr><th>来源 / 请求 ID</th><th>业务类型</th><th>结果</th><th>耗时</th><th>业务标识</th><th>调用时间</th></tr></thead><tbody>'+state.items.map(function(x,i){return '<tr data-index="'+i+'"><td><span class="primary-text">'+esc(sourceSystemLabel(x.source_system))+'</span><span class="subline mono">'+esc(x.request_id)+'</span></td><td><span class="primary-text">'+esc(businessTypeLabel(x))+'</span><span class="subline">'+esc(operationLabel(x.operation))+'</span></td><td>'+statusHtml(String(x.response_status),x.outcome)+'<span class="subline">'+esc(x.outcome)+'</span></td><td><span class="primary-text">'+esc(x.duration_ms)+' ms</span><span class="subline">'+esc(x.request_bytes)+' bytes</span></td><td><span class="primary-text mono">'+esc(x.external_task_id||x.external_package_id||"-")+'</span><span class="subline mono">'+esc(x.method)+' '+esc(x.path)+'</span></td><td><span class="primary-text">'+esc(time(x.received_at))+'</span><span class="subline">'+esc(x.client_ip||"-")+'</span></td></tr>';}).join("")+'</tbody></table>'; }
    function bindRows(){ document.querySelectorAll("#tableRoot [data-index]").forEach(function(row){row.onclick=function(){var item=state.items[Number(row.getAttribute("data-index"))]; if(state.view==="chains")openChain(item);else openCall(item);};}); }
    function renderTable(){ document.getElementById("tableRoot").innerHTML=state.view==="chains"?renderChains():renderCalls(); document.getElementById("viewTotal").textContent="共 "+state.total+" 条"; var pages=Math.max(1,Math.ceil(state.total/state.size)); document.getElementById("pagerLabel").textContent="第 "+(state.page+1)+" / "+pages+" 页"; document.getElementById("btnPrev").disabled=state.page<=0; document.getElementById("btnNext").disabled=(state.page+1)*state.size>=state.total; bindRows(); }
    async function loadSummary(){ state.summary=await api("/third-party-calls/summary"); renderSummary(); }
    async function loadList(){ if(!syncAuth())return; state.loading=true; document.getElementById("tableRoot").innerHTML='<div class="loading">正在加载...</div>'; var f=filters(), data, requestSize=f.business_type?100:state.size; if(state.view==="chains"){data=await api("/third-party-calls/chains?"+queryString({source_system:f.source_system,business_type:f.business_type,health:f.health,keyword:f.keyword,page:0,size:requestSize}));}else{data=await api("/third-party-calls/audit-events?"+queryString({source_system:f.source_system,business_type:f.business_type,outcome:f.outcome,keyword:f.keyword,hours:f.hours,page:0,size:requestSize}));} var items=data.items||[]; if(f.business_type){var filtered=items.filter(function(item){return businessTypeKey(item)===f.business_type;}); var serverApplied=items.length===filtered.length; state.total=serverApplied?Number(data.total||filtered.length):filtered.length; state.items=filtered.slice(state.page*state.size,(state.page+1)*state.size);}else{state.items=items;state.total=Number(data.total||0);} state.loading=false; renderTable(); }
    async function refreshAll(){ var btn=document.getElementById("btnRefresh"); btn.disabled=true; try{await Promise.all([loadSummary(),loadList()]);}finally{btn.disabled=false;} }
    function switchView(view){ state.view=view; state.page=0; document.querySelectorAll("[data-view]").forEach(function(btn){var active=btn.getAttribute("data-view")===view;btn.classList.toggle("active",active);btn.setAttribute("aria-selected",active?"true":"false");}); var chains=view==="chains"; document.getElementById("chainTypeField").hidden=!chains; document.getElementById("chainHealthField").hidden=!chains; document.getElementById("callOutcomeField").hidden=chains; document.getElementById("callHoursField").hidden=chains; loadList().catch(showError); }
    function showError(err){ document.getElementById("tableRoot").innerHTML='<div class="error-state">'+esc(err&&err.message?err.message:err)+'</div>'; toast(err&&err.message?err.message:String(err)); }
    function openModal(){ document.getElementById("detailModalBackdrop").classList.add("show"); document.getElementById("detailModal").setAttribute("aria-hidden","false"); document.getElementById("btnCloseModal").focus(); }
    function closeModal(){ document.getElementById("detailModalBackdrop").classList.remove("show"); document.getElementById("detailModal").setAttribute("aria-hidden","true"); }
    function resourceHtml(resources){ var rows=[]; Object.keys(resources||{}).forEach(function(key){var value=resources[key]; if(Array.isArray(value)){value.forEach(function(v){rows.push('<span class="resource">'+esc(key)+': '+esc(v)+'</span>');});}else if(value!==null&&value!==""&&value!==undefined){rows.push('<span class="resource">'+esc(key)+': '+esc(value)+'</span>');}}); return rows.join("")||'<span class="subline">暂无关联资源</span>'; }
    function eventHtml(events){ if(!events||!events.length)return '<div class="subline">尚无上线后的逐次调用审计记录</div>'; return '<div class="event-list">'+events.slice(0,12).map(function(e){return '<div class="event-row"><span class="mono">'+esc(e.request_id)+'</span><span>'+esc(e.method)+' '+esc(e.path)+'</span>'+statusHtml(String(e.response_status),e.outcome)+'</div>';}).join("")+'</div>'; }
    async function openChain(item){ openModal(); document.getElementById("modalKicker").textContent=item.operation_label||"业务链路"; document.getElementById("modalTitle").textContent=item.title||item.record_id; var badge=document.getElementById("modalStatus");badge.textContent=item.status_label;badge.className="status "+item.health; document.getElementById("modalBody").innerHTML='<div class="loading">正在加载...</div>'; try{var d=await api("/third-party-calls/chains/"+encodeURIComponent(item.record_type)+"/"+encodeURIComponent(item.record_id)), c=d.chain||item; document.getElementById("modalBody").innerHTML='<div class="action-callout"><label>下一步 · '+esc(c.next_action_owner||"-")+'</label><strong>'+esc(c.next_action||"-")+'</strong></div><section class="detail-section"><h3>业务摘要</h3><div class="detail-grid"><div class="detail-item"><label>来源系统</label><span>'+esc(sourceSystemLabel(c.source_system))+'</span></div><div class="detail-item"><label>记录类型</label><span>'+esc(c.operation_label)+'</span></div><div class="detail-item"><label>外部任务 ID</label><span class="mono">'+esc(c.external_task_id||"-")+'</span></div><div class="detail-item"><label>外部数据包 ID</label><span class="mono">'+esc(c.external_package_id||"-")+'</span></div><div class="detail-item"><label>当前阶段</label><span>'+esc(c.current_stage||"-")+'</span></div><div class="detail-item"><label>状态说明</label><span>'+esc(c.status_detail||"-")+'</span></div></div></section><section class="detail-section"><h3>关联资源</h3><div class="resource-list">'+resourceHtml(c.linked_resources)+'</div></section><section class="detail-section"><h3>阶段时间线</h3><div class="timeline">'+(d.timeline||[]).map(function(t){return '<div class="timeline-item"><strong>'+esc(t.label)+'</strong><span>'+esc(time(t.time))+' · '+esc(t.detail||"")+'</span></div>';}).join("")+'</div></section><section class="detail-section"><h3>调用记录</h3>'+eventHtml(d.call_events)+'</section><section class="detail-section"><h3>执行证据</h3><pre>'+esc(JSON.stringify(d.evidence||{},null,2))+'</pre></section>'; }catch(e){document.getElementById("modalBody").innerHTML='<div class="error-state">'+esc(e.message||e)+'</div>';}}
    function openCall(item){ openModal(); document.getElementById("modalKicker").textContent=operationLabel(item.operation); document.getElementById("modalTitle").textContent=item.request_id; var badge=document.getElementById("modalStatus");badge.textContent=String(item.response_status);badge.className="status "+item.outcome; document.getElementById("modalBody").innerHTML='<section class="detail-section"><h3>请求摘要</h3><div class="detail-grid"><div class="detail-item"><label>来源系统</label><span>'+esc(sourceSystemLabel(item.source_system))+'</span></div><div class="detail-item"><label>调用时间</label><span>'+esc(time(item.received_at))+'</span></div><div class="detail-item"><label>接口</label><span class="mono">'+esc(item.method)+' '+esc(item.path)+'</span></div><div class="detail-item"><label>耗时</label><span>'+esc(item.duration_ms)+' 毫秒</span></div><div class="detail-item"><label>外部任务 ID</label><span class="mono">'+esc(item.external_task_id||"-")+'</span></div><div class="detail-item"><label>外部数据包 ID</label><span class="mono">'+esc(item.external_package_id||"-")+'</span></div><div class="detail-item"><label>来源 IP</label><span class="mono">'+esc(item.client_ip||"-")+'</span></div><div class="detail-item"><label>请求大小</label><span>'+esc(item.request_bytes)+' 字节</span></div></div></section><section class="detail-section"><h3>错误摘要</h3><pre>'+esc(item.error_summary||"无")+'</pre></section>'; }
    function resetFilters(){ ["filterKeyword","filterSource","filterType","filterHealth","filterOutcome"].forEach(function(id){document.getElementById(id).value="";}); document.getElementById("filterHours").value="168"; state.page=0; loadList().catch(showError); }
    document.querySelectorAll("[data-view]").forEach(function(btn){btn.onclick=function(){switchView(btn.getAttribute("data-view"));};});
    document.getElementById("btnQuery").onclick=function(){state.page=0;loadList().catch(showError);}; document.getElementById("btnReset").onclick=resetFilters; document.getElementById("btnRefresh").onclick=function(){refreshAll().catch(showError);}; document.getElementById("btnPrev").onclick=function(){if(state.page>0){state.page--;loadList().catch(showError);}}; document.getElementById("btnNext").onclick=function(){if((state.page+1)*state.size<state.total){state.page++;loadList().catch(showError);}}; document.getElementById("btnCloseModal").onclick=closeModal; document.getElementById("detailModalBackdrop").onclick=closeModal; document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();}); document.getElementById("filterKeyword").addEventListener("keydown",function(e){if(e.key==="Enter"){state.page=0;loadList().catch(showError);}});
    function boot(){ if(!syncAuth())return; refreshAll().catch(showError); window.addEventListener("labelu-auth-ready",function(){refreshAll().catch(showError);}); }
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot,{once:true});else boot();
  })();
  </script>
</body>
</html>
